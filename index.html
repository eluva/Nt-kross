<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NT Kross — мини-приложение</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  :root{--bg:#101010;--s1:#1A1A1A;--s2:#242424;--line:#2E2E2E;--text:#F4F2EE;--muted:#A3A09A;--accent:#D6FF3D;--ink:#101010}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#050505;display:flex;align-items:center;justify-content:center;font-family:Manrope,system-ui,sans-serif;color:var(--text)}
  .phone{width:390px;height:844px;max-height:100vh;background:var(--bg);border-radius:36px;overflow:hidden;position:relative;box-shadow:0 0 0 10px #1c1c1c,0 30px 80px rgba(0,0,0,.6)}
  @media (max-width:500px){body{display:block;background:var(--bg)}.phone{width:100vw;height:100vh;height:100dvh;max-height:none;border-radius:0;box-shadow:none}}
  #app{height:100%;display:flex;flex-direction:column}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:inherit}
  .disp{font-family:Unbounded,sans-serif;font-weight:700}
  .muted{color:var(--muted)}
  .scroll{flex:1;min-height:0;overflow-y:auto}
  .pad{padding:0 16px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 12px}
  .bar{display:flex;align-items:center;gap:12px;padding:16px}
  .round{width:44px;height:44px;border-radius:999px;border:none;background:var(--s1);display:flex;align-items:center;justify-content:center}
  .langs{display:flex;padding:3px;background:var(--s1);border-radius:999px;gap:2px}
  .langs button{min-width:44px;height:32px;border-radius:999px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:700}
  .langs button.on{background:var(--text);color:var(--ink)}
  .search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px}
  .search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;min-width:0}
  .hero{display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--accent);color:var(--ink);border-radius:20px}
  .tag{padding:5px 10px;background:var(--ink);color:var(--text);border-radius:999px;font-size:12px;font-weight:600}
  .chips{display:flex;gap:8px}
  .pill{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:600}
  .pill.on{border-color:var(--text);background:var(--text);color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card{display:flex;flex-direction:column;gap:8px;padding:0;border:none;background:transparent;text-align:left}
  .ph{position:relative;aspect-ratio:1/1;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph .lbl{position:absolute;left:10px;bottom:8px;font-size:10px;color:var(--muted)}
  .ph .cnt{position:absolute;right:8px;top:8px;padding:3px 7px;background:var(--ink);border-radius:999px;font-size:10px}
  .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:8px 8px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .nav button,.nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:52px;border:none;background:transparent;color:var(--muted);font-size:11px;font-weight:600;text-decoration:none}
  .nav .on{color:var(--accent)}
  .badge{position:absolute;top:2px;left:56%;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .foot{padding:12px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .big{width:100%;height:54px;border:none;border-radius:16px;background:var(--accent);color:var(--ink);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none}
  .big:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
  .big.light{background:var(--text)}
  .big.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
  .sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .sz{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--s1);font-size:15px;font-weight:700}
  .sz.on{border:2px solid var(--accent);background:var(--s2)}
  .box{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--s1);border-radius:14px;font-size:13px}
  .row{display:flex;justify-content:space-between;gap:8px}
  .sum{padding-top:8px;border-top:1px solid var(--line);font-size:15px}
  .line{display:flex;gap:12px;padding:10px;background:var(--s1);border-radius:16px;align-items:center}
  .thumb{width:72px;height:72px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .qty{display:flex;align-items:center;gap:4px;background:var(--s2);border-radius:12px;padding:2px}
  .qty button{width:36px;height:44px;border:none;background:transparent;font-size:20px}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
  .field input{height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--s1);font-size:15px;outline:none}
  .field input:focus{border-color:var(--accent)}
  .seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;background:var(--s1);border-radius:14px}
  .seg button{height:44px;border-radius:11px;border:none;background:transparent;font-size:14px;font-weight:600}
  .seg button.on{background:var(--text);color:var(--ink)}
  .opt{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--s1);font-size:15px;font-weight:600;width:100%;text-align:left}
  .opt .dot{width:18px;height:18px;flex-shrink:0;border-radius:999px;border:2px solid #5A5854}
  .opt.on{border:2px solid var(--accent)}
  .opt.on .dot{border:6px solid var(--accent)}
  .col{display:flex;flex-direction:column}
  /* manager chat */
  .tgchat{background:#17212B}
  .tghead{display:flex;align-items:center;gap:12px;padding:16px;background:#1F2C38}
  .bubble{max-width:320px;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px 16px 16px 4px;background:#1F2C38;font-size:14px;line-height:1.45}
  .tgbtns{max-width:320px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .tgbtns button{height:44px;border-radius:12px;border:none;background:#2B5278;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div class="phone"><div id="app"></div></div>

<script>
/* ===== Данные из канала @nt_kross_uzb =====
   Чтобы подставить фото: положите файлы рядом (например img/aj4m-1.jpg)
   и впишите пути в поле img. Пустой img = заглушка. */
var PRODUCTS = [
  { id:"aj4m", name:"Air Jordan 4",       tag:"Jordan", price:455000, sizes:["40","41","42","43","44","45","46","47"], photos:8, tint:"#2B2620", img:"" },
  { id:"aj4s", name:"Air Jordan 4",       tag:"Jordan", price:455000, sizes:["36","37","38","39","40","41"],           photos:8, tint:"#2A2428", img:"" },
  { id:"nzg",  name:"Nike Zoom Gore-Tex", tag:"Nike",   price:455000, sizes:["41","42","43","44","45"],                photos:4, tint:"#21272B", img:"" },
  { id:"nz",   name:"Nike Zoom",          tag:"Nike",   price:435000, sizes:["41","42","43","44","45"],                photos:2, tint:"#262926", img:"" }
];
var MANAGER = "ntkross_admin";
var SHOP_PHONE = "+998 (91) 163-00-34";

var STR = {
  ru:{tagline:"Кроссовки в наличии",search:"Поиск кроссовок",hero:"Новые пары каждую неделю",paysub:"Оплата при получении или онлайн",cash:"Наличные",all:"Все",photo:"фото из канала",nothing:"Ничего не найдено",home:"Главная",cart:"Корзина",contact:"Написать",back:"Назад",sizes:"Размеры в наличии",pay:"Оплата",phone:"Телефон",pickSize:"Выберите размер",add:"В корзину",added:"Добавлено",toCart:"Перейти в корзину",size:"Размер",empty:"Корзина пуста",toCatalog:"Перейти в каталог",total:"Итого",pcs:"шт.",checkout:"Оформить заказ",name:"Имя",delivery:"Получение",pickup:"Самовывоз",deliv:"Доставка",address:"Адрес доставки",confirm:"Подтвердить заказ",fillHint:"Укажите имя и телефон",done:"Заказ принят",orderNo:"Заказ №",doneSub:"Менеджер @"+MANAGER+" свяжется с вами, чтобы подтвердить заказ и размер.",writeManager:"Написать менеджеру",backHome:"На главную",sum:"сум",seeManager:"Как заказ видит менеджер"},
  uz:{tagline:"Mavjud krossovkalar",search:"Krossovka qidirish",hero:"Har hafta yangi juftliklar",paysub:"To'lov qabul qilishda yoki onlayn",cash:"Naqd pul",all:"Hammasi",photo:"kanaldan rasm",nothing:"Hech narsa topilmadi",home:"Bosh sahifa",cart:"Savat",contact:"Yozish",back:"Orqaga",sizes:"Mavjud o'lchamlar",pay:"To'lov",phone:"Telefon",pickSize:"O'lchamni tanlang",add:"Savatga",added:"Qo'shildi",toCart:"Savatga o'tish",size:"O'lcham",empty:"Savat bo'sh",toCatalog:"Katalogga o'tish",total:"Jami",pcs:"dona",checkout:"Buyurtma berish",name:"Ism",delivery:"Qabul qilish",pickup:"Olib ketish",deliv:"Yetkazib berish",address:"Yetkazish manzili",confirm:"Buyurtmani tasdiqlash",fillHint:"Ism va telefonni kiriting",done:"Buyurtma qabul qilindi",orderNo:"Buyurtma №",doneSub:"Menejer @"+MANAGER+" buyurtma va o'lchamni tasdiqlash uchun siz bilan bog'lanadi.",writeManager:"Menejerga yozish",backHome:"Bosh sahifa",sum:"so'm",seeManager:"Menejer buyurtmani qanday ko'radi"}
};

var S = { screen:"home", lang:"ru", cat:"all", q:"", sel:"aj4m", size:null, added:false, cart:[],
          delivery:"pickup", pay:"payme", name:"", phone:"", addr:"", orderNo:"" };

/* ===== Telegram Mini App ===== */
var tg = window.Telegram && window.Telegram.WebApp;
if (tg && tg.initData) {
  tg.ready(); tg.expand();
  var u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) { if (u.first_name) S.name = u.first_name; if (u.language_code === "uz") S.lang = "uz"; }
}

var byId = {}; PRODUCTS.forEach(function(p){ byId[p.id] = p; });
function L(){ return STR[S.lang]; }
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ") + " " + L().sum; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

var SHOE = '<svg width="92" height="58" viewBox="0 0 64 40" fill="none" stroke="#F4F2EE" stroke-opacity="0.4" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 31 L8 19 Q10 16 13 17 L20 20 L27 11 Q29 9 31 11 L37 19 L52 23 Q61 25 61 31 Z"/><path d="M3 31 L61 31 L61 35 L3 35 Z"/><path d="M28 14 L32 17 M25 17 L29 20"/></svg>';
var BACK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
function shoe(w){ return SHOE.replace('width="92" height="58"','width="'+w+'" height="'+Math.round(w*0.63)+'"'); }
function photo(p, w){ return p.img ? '<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'">' : shoe(w); }

function cartInfo(){
  var total=0, count=0;
  var lines = S.cart.map(function(x,i){ var p=byId[x.id]; total+=p.price*x.qty; count+=x.qty; return {p:p,x:x,i:i}; });
  return {lines:lines,total:total,count:count};
}
function canConfirm(){
  var d=(S.phone||"").replace(/\D/g,"");
  return S.name.trim() && d.length>=9 && cartInfo().count>0;
}

/* ===== Экраны ===== */
function gridHtml(){
  var q=S.q.toLowerCase();
  var list=PRODUCTS.filter(function(p){ return (S.cat==="all"||p.tag===S.cat) && (!q||p.name.toLowerCase().indexOf(q)>=0); });
  if(!list.length) return '<div class="muted" style="grid-column:1/-1;padding:24px;text-align:center;font-size:14px">'+L().nothing+'</div>';
  return list.map(function(p){
    return '<button class="card" data-a="open" data-v="'+p.id+'"><div class="ph" style="background:'+p.tint+'">'+photo(p,92)+
      (p.img?'':'<span class="lbl">'+L().photo+'</span>')+'<span class="cnt">1/'+p.photos+'</span></div>'+
      '<div class="col" style="gap:2px;padding:0 2px"><div style="font-size:14px;font-weight:700">'+p.name+'</div>'+
      '<div class="muted" style="font-size:12px">'+L().size+' '+p.sizes[0]+'–'+p.sizes[p.sizes.length-1]+'</div>'+
      '<div style="font-size:15px;font-weight:700;margin-top:2px">'+fmt(p.price)+'</div></div></button>';
  }).join("");
}
function nav(active){
  var c=cartInfo().count;
  return '<nav class="nav">'+
    '<button data-a="go" data-v="home" class="'+(active==="home"?"on":"")+'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>'+L().home+'</button>'+
    '<button data-a="go" data-v="cart" class="'+(active==="cart"?"on":"")+'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 7h14l-1.5 12h-11z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>'+L().cart+(c?'<span class="badge">'+c+'</span>':'')+'</button>'+
    '<a href="https://t.me/'+MANAGER+'" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 4L3 11l6 2 2 6 3-4 5 4z"/></svg>'+L().contact+'</a>'+
  '</nav>';
}

var screens = {
  home: function(){
    var t=L();
    var cats=[["all",t.all],["Jordan","Jordan"],["Nike","Nike"]].map(function(c){
      return '<button class="pill'+(S.cat===c[0]?" on":"")+'" data-a="cat" data-v="'+c[0]+'">'+c[1]+'</button>'; }).join("");
    return '<div class="top"><div class="col" style="gap:2px"><div class="disp" style="font-size:22px;letter-spacing:.5px">NT KROSS</div><div class="muted" style="font-size:12px">'+t.tagline+'</div></div>'+
      '<div class="langs"><button data-a="lang" data-v="ru" class="'+(S.lang==="ru"?"on":"")+'">RU</button><button data-a="lang" data-v="uz" class="'+(S.lang==="uz"?"on":"")+'">UZ</button></div></div>'+
      '<div class="scroll pad col" style="gap:16px;padding-top:4px;padding-bottom:20px">'+
        '<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A09A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input data-f="q" value="'+esc(S.q)+'" placeholder="'+t.search+'" aria-label="'+t.search+'"></label>'+
        '<div class="hero"><div class="disp" style="font-size:20px;line-height:1.2">'+t.hero+'</div><div style="font-size:13px;font-weight:600">'+t.paysub+'</div><div style="display:flex;gap:6px"><span class="tag">'+t.cash+'</span><span class="tag">Payme</span><span class="tag">Click</span></div></div>'+
        '<div class="chips">'+cats+'</div>'+
        '<div class="grid" id="grid">'+gridHtml()+'</div>'+
      '</div>'+nav("home");
  },
  product: function(){
    var t=L(), p=byId[S.sel];
    var sizes=p.sizes.map(function(z){ return '<button class="sz'+(S.size===z?" on":"")+'" data-a="size" data-v="'+z+'">'+z+'</button>'; }).join("");
    var btn = S.added
      ? '<button class="big light" data-a="go" data-v="cart">'+t.added+' · '+t.toCart+'</button>'
      : '<button class="big" data-a="add"'+(S.size?'':' disabled')+'>'+(S.size? t.add+' · '+fmt(p.price) : t.pickSize)+'</button>';
    return '<div class="scroll">'+
      '<div class="ph" style="aspect-ratio:auto;height:380px;border-radius:0;background:'+p.tint+'">'+photo(p,220)+
        '<button class="round" style="position:absolute;left:16px;top:16px;background:var(--ink)" data-a="go" data-v="home" aria-label="'+t.back+'">'+BACK+'</button>'+
        (p.img?'':'<span class="lbl" style="left:16px;bottom:14px;font-size:11px">'+t.photo+'</span>')+
        '<span class="cnt" style="right:16px;top:auto;bottom:12px;font-size:12px;padding:4px 10px">1 / '+p.photos+'</span></div>'+
      '<div class="pad col" style="gap:18px;padding-top:20px;padding-bottom:24px">'+
        '<div class="col" style="gap:6px"><div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:1px">'+p.tag+'</div><div class="disp" style="font-size:24px;line-height:1.15">'+p.name+'</div><div style="font-size:22px;font-weight:700;color:var(--accent)">'+fmt(p.price)+'</div></div>'+
        '<div class="col" style="gap:10px"><div class="row" style="font-size:14px;font-weight:600"><span>'+t.sizes+'</span><span class="muted" style="font-weight:500">EU</span></div><div class="sizes">'+sizes+'</div></div>'+
        '<div class="box"><div class="row"><span class="muted">'+t.pay+'</span><span style="font-weight:600">'+t.cash+' · Payme · Click</span></div><div class="row"><span class="muted">'+t.phone+'</span><span style="font-weight:600">'+SHOP_PHONE+'</span></div></div>'+
      '</div></div><div class="foot">'+btn+'</div>';
  },
  cart: function(){
    var t=L(), ci=cartInfo();
    var body = ci.count ? ci.lines.map(function(l){
      return '<div class="line"><div class="thumb" style="background:'+l.p.tint+'">'+photo(l.p,50)+'</div>'+
        '<div class="col" style="flex:1;gap:4px;min-width:0"><div style="font-size:14px;font-weight:700">'+l.p.name+'</div><div class="muted" style="font-size:12px">'+t.size+' '+l.x.size+'</div><div style="font-size:14px;font-weight:700">'+fmt(l.p.price*l.x.qty)+'</div></div>'+
        '<div class="qty"><button data-a="dec" data-v="'+l.i+'" aria-label="−">−</button><span style="min-width:16px;text-align:center;font-weight:700">'+l.x.qty+'</span><button data-a="inc" data-v="'+l.i+'" aria-label="+">+</button></div></div>';
    }).join("") : '<div class="col muted" style="align-items:center;gap:14px;padding:80px 16px;text-align:center"><div style="font-size:15px">'+t.empty+'</div><button class="pill" data-a="go" data-v="home" style="height:46px;color:var(--text)">'+t.toCatalog+'</button></div>';
    return '<div class="bar"><button class="round" data-a="go" data-v="home" aria-label="'+t.back+'">'+BACK+'</button><div class="disp" style="font-size:20px">'+t.cart+'</div></div>'+
      '<div class="scroll pad col" style="gap:10px;padding-bottom:16px">'+body+'</div>'+
      (ci.count ? '<div class="foot"><div class="row" style="align-items:baseline"><span class="muted" style="font-size:14px">'+t.total+' · '+ci.count+' '+t.pcs+'</span><span style="font-size:22px;font-weight:700">'+fmt(ci.total)+'</span></div><button class="big" data-a="go" data-v="checkout">'+t.checkout+'</button></div>' : nav("cart"));
  },
  checkout: function(){
    var t=L(), ci=cartInfo();
    var pays=[["cash",t.cash],["payme","Payme"],["click","Click"]].map(function(m){
      return '<button class="opt'+(S.pay===m[0]?" on":"")+'" data-a="pay" data-v="'+m[0]+'"><span class="dot"></span><span>'+m[1]+'</span></button>'; }).join("");
    var ok=canConfirm();
    return '<div class="bar"><button class="round" data-a="go" data-v="cart" aria-label="'+t.back+'">'+BACK+'</button><div class="disp" style="font-size:20px">'+t.checkout+'</div></div>'+
      '<div class="scroll pad col" style="gap:18px;padding-bottom:16px">'+
        '<div class="col" style="gap:10px"><label class="field">'+t.name+'<input data-f="name" value="'+esc(S.name)+'" autocomplete="given-name"></label>'+
        '<label class="field">'+t.phone+'<input data-f="phone" value="'+esc(S.phone)+'" inputmode="tel" placeholder="+998" autocomplete="tel"></label></div>'+
        '<div class="col" style="gap:8px"><div style="font-size:14px;font-weight:600">'+t.delivery+'</div><div class="seg"><button data-a="deliv" data-v="pickup" class="'+(S.delivery==="pickup"?"on":"")+'">'+t.pickup+'</button><button data-a="deliv" data-v="deliv" class="'+(S.delivery==="deliv"?"on":"")+'">'+t.deliv+'</button></div>'+
        (S.delivery==="deliv"?'<label class="field">'+t.address+'<input data-f="addr" value="'+esc(S.addr)+'" autocomplete="street-address"></label>':'')+'</div>'+
        '<div class="col" style="gap:8px"><div style="font-size:14px;font-weight:600">'+t.pay+'</div>'+pays+'</div>'+
        summary(ci)+
      '</div><div class="foot"><div id="hint" class="muted" style="font-size:12px;text-align:center;'+(ok?"display:none":"")+'">'+t.fillHint+'</div><button id="confirm" class="big" data-a="confirm"'+(ok?'':' disabled')+'>'+t.confirm+'</button></div>';
  },
  done: function(){
    var t=L(), ci=cartInfo();
    return '<div class="scroll pad col" style="align-items:center;justify-content:center;gap:16px;text-align:center">'+
      '<div style="width:88px;height:88px;border-radius:999px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>'+
      '<div class="disp" style="font-size:24px">'+t.done+'</div><div class="muted" style="font-size:14px">'+t.orderNo+' '+S.orderNo+'</div>'+
      '<div style="font-size:15px;line-height:1.5;max-width:300px">'+t.doneSub+'</div>'+
      '<div style="width:100%;text-align:left">'+summary(ci,true)+'</div>'+
      '<button data-a="go" data-v="manager" style="border:none;background:transparent;color:var(--muted);text-decoration:underline;font-size:13px;min-height:44px">'+t.seeManager+'</button>'+
      '</div><div class="foot"><a class="big" href="https://t.me/'+MANAGER+'" target="_blank" rel="noopener">'+t.writeManager+'</a><button class="big ghost" data-a="restart">'+t.backHome+'</button></div>';
  },
  manager: function(){
    var ci=cartInfo();
    var items=ci.lines.map(function(l){ return '<div>'+l.p.name+' · размер '+l.x.size+' × '+l.x.qty+' — '+fmt(l.p.price*l.x.qty)+'</div>'; }).join("");
    var payName={cash:"наличные",payme:"Payme",click:"Click"}[S.pay];
    var now=new Date(); var hm=("0"+now.getHours()).slice(-2)+":"+("0"+now.getMinutes()).slice(-2);
    return '<div class="tgchat col" style="height:100%">'+
      '<div class="tghead"><button class="round" style="background:transparent" data-a="go" data-v="done" aria-label="Назад">'+BACK+'</button>'+
      '<div style="width:44px;height:44px;border-radius:999px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px" class="disp">NT</div>'+
      '<div class="col" style="gap:2px"><div style="font-size:16px;font-weight:700">NT Kross · заказы</div><div style="font-size:12px;color:#8FA3B5">бот · чат менеджера @'+MANAGER+'</div></div></div>'+
      '<div class="scroll col" style="justify-content:flex-end;gap:12px;padding:16px">'+
        '<div style="align-self:center;padding:4px 12px;border-radius:999px;background:#0E1621;font-size:12px;color:#8FA3B5">Сегодня</div>'+
        '<div class="bubble"><div style="font-weight:700;font-size:15px">Новый заказ №'+S.orderNo+'</div><div class="col" style="gap:4px">'+items+'</div>'+
        '<div style="font-weight:700">Итого: '+fmt(ci.total)+'</div>'+
        '<div class="col" style="gap:4px;padding-top:8px;border-top:1px solid #2B3B4A;color:#C9D3DC"><div>Клиент: '+esc(S.name)+'</div><div>Телефон: '+esc(S.phone)+'</div>'+
        '<div>Получение: '+(S.delivery==="deliv"?"доставка"+(S.addr?", "+esc(S.addr):""):"самовывоз")+'</div><div>Оплата: '+payName+'</div></div>'+
        '<div style="align-self:flex-end;font-size:11px;color:#8FA3B5">'+hm+'</div></div>'+
        '<div class="tgbtns"><button>Подтвердить</button><button>Написать клиенту</button><button>Нет размера</button><button>Отменить</button></div>'+
      '</div></div>';
  }
};

function summary(ci, withPay){
  var t=L();
  return '<div class="box">'+ci.lines.map(function(l){
    return '<div class="row"><span class="muted">'+l.p.name+' · '+l.x.size+' × '+l.x.qty+'</span><span style="font-weight:600">'+fmt(l.p.price*l.x.qty)+'</span></div>'; }).join("")+
    '<div class="row sum"><span style="font-weight:600">'+t.total+'</span><span style="font-weight:700">'+fmt(ci.total)+'</span></div>'+
    (withPay?'<div class="row"><span class="muted">'+t.pay+'</span><span style="font-weight:600">'+({cash:t.cash,payme:"Payme",click:"Click"}[S.pay])+'</span></div>':'')+'</div>';
}

/* ===== Логика ===== */
var app=document.getElementById("app");
function render(){ app.innerHTML = screens[S.screen](); document.documentElement.lang = S.lang; }

var actions = {
  go: function(v){ S.screen=v; S.added=false; },
  lang: function(v){ S.lang=v; },
  cat: function(v){ S.cat=v; },
  open: function(v){ S.screen="product"; S.sel=v; S.size=null; S.added=false; },
  size: function(v){ S.size=v; S.added=false; },
  add: function(){
    if(!S.size) return;
    var hit=S.cart.filter(function(x){ return x.id===S.sel && x.size===S.size; })[0];
    if(hit) hit.qty++; else S.cart.push({id:S.sel,size:S.size,qty:1});
    S.added=true;
    if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  },
  inc: function(v){ S.cart[+v].qty++; },
  dec: function(v){ S.cart[+v].qty--; if(S.cart[+v].qty<=0) S.cart.splice(+v,1); },
  deliv: function(v){ S.delivery=v; },
  pay: function(v){ S.pay=v; },
  confirm: function(){
    if(!canConfirm()) return;
    S.orderNo=String(1000+Math.floor(Math.random()*9000));
    S.screen="done";
    /* Интеграция: здесь заказ отправляется боту/серверу.
       Если приложение открыто кнопкой клавиатуры бота — tg.sendData передаст JSON боту. */
    var order={no:S.orderNo,items:S.cart,name:S.name,phone:S.phone,delivery:S.delivery,addr:S.addr,pay:S.pay};
    try { if(tg && tg.initData && tg.sendData) { /* tg.sendData(JSON.stringify(order)); */ } } catch(e){}
    window.lastOrder=order;
  },
  restart: function(){ S.screen="home"; S.cart=[]; S.phone=""; S.addr=""; S.size=null; S.added=false; }
};

app.addEventListener("click", function(e){
  var b=e.target.closest("[data-a]"); if(!b || b.disabled) return;
  var prev=S.screen;
  actions[b.dataset.a](b.dataset.v);
  render();
  if(S.screen!==prev){ var sc=app.querySelector(".scroll"); if(sc) sc.scrollTop=0; }
});
app.addEventListener("input", function(e){
  var f=e.target.dataset.f; if(!f) return;
  S[f]=e.target.value;
  if(f==="q"){ document.getElementById("grid").innerHTML=gridHtml(); }
  var btn=document.getElementById("confirm");
  if(btn){ var ok=canConfirm(); btn.disabled=!ok; document.getElementById("hint").style.display=ok?"none":""; }
});

render();
</script>
</body>
</html>
